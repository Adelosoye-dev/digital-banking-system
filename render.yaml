# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and provisions the service with the env vars below.
#
# Secrets are NEVER committed:
#   - generateValue: true  -> Render generates a strong random value itself
#   - sync: false          -> Render prompts you to paste the value on first deploy
services:
  - type: web
    name: fet-bank-api
    runtime: node
    plan: free
    region: oregon
    # Prune dev dependencies - the app must not need jest or pino-pretty at runtime.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Render restarts the instance if this stops returning 2xx.
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Render injects PORT itself; the app reads it from the environment.
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: info

      # --- Bank identity, as registered with NibssByPhoenix ---------------
      - key: BANK_NAME
        value: FET Bank
      - key: BANK_CODE
        value: "600"

      # --- MongoDB Atlas: paste the SRV connection string on first deploy --
      - key: MONGODB_URI
        sync: false

      # --- Auth secrets: generated by Render, never seen by anyone ---------
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"

      # --- NibssByPhoenix provider credentials -----------------------------
      - key: NIBSS_BASE_URL
        value: https://nibssbyphoenix.onrender.com
      - key: NIBSS_API_KEY
        sync: false
      - key: NIBSS_API_SECRET
        sync: false
      # The provider is itself on Render's free tier, so it cold-starts slowly.
      - key: NIBSS_TIMEOUT_MS
        value: "45000"
      - key: NIBSS_MAX_RETRIES
        value: "4"
      - key: NIBSS_TOKEN_SKEW_SECONDS
        value: "60"

      # --- Business rules (kobo) -------------------------------------------
      - key: OPENING_BALANCE_KOBO
        value: "1500000"
      - key: MAX_ACCOUNTS_PER_CUSTOMER
        value: "1"
      - key: MIN_TRANSFER_KOBO
        value: "100"
      - key: MAX_TRANSFER_KOBO
        value: "100000000"
      - key: NAME_ENQUIRY_TTL_SECONDS
        value: "900"

      # --- Protection -------------------------------------------------------
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: CORS_ORIGIN
        value: "*"
